services:
  webapp:
    container_name: nextjs-kubr
    build:
      context: ../
      dockerfile: ./infra/docker/stg.dockerfile
    ports:
      - "3000:3000"
    expose:
      - 3000
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nextjs-kubr-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs
    depends_on:
      - webapp
